<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - Efecan Ticaret</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı. Efecan Ticaret ana sayfasına dönün.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-gray-900 to-black min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 text-center">
        <div class="max-w-2xl mx-auto">
            <!-- 404 Icon -->
            <div class="mb-8">
                <div class="w-32 h-32 mx-auto bg-gradient-to-br from-red-500 to-red-600 rounded-full flex items-center justify-center shadow-2xl">
                    <i class="fas fa-exclamation-triangle text-white text-5xl"></i>
                </div>
            </div>
            
            <!-- Error Message -->
            <h1 class="text-6xl md:text-8xl font-bold text-white mb-4">404</h1>
            <h2 class="text-2xl md:text-3xl font-semibold text-gray-300 mb-6">Sayfa Bulunamadı</h2>
            <p class="text-lg text-gray-400 mb-8 leading-relaxed">
                Aradığınız sayfa mevcut değil veya taşınmış olabilir. 
                Ana sayfamıza dönerek ürünlerimizi inceleyebilirsiniz.
            </p>
            
            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="bg-gradient-to-r from-red-600 to-red-700 text-white px-8 py-4 rounded-full font-semibold hover:from-red-700 hover:to-red-800 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                    <i class="fas fa-home mr-2"></i>Ana Sayfaya Dön
                </a>
                <a href="/products.html" class="bg-white/20 backdrop-blur-sm border-2 border-white/30 text-white px-8 py-4 rounded-full font-semibold hover:bg-white/30 hover:border-white/50 transition-all duration-300">
                    <i class="fas fa-shopping-cart mr-2"></i>Ürünleri İncele
                </a>
            </div>
            
            <!-- Contact Info -->
            <div class="mt-12 p-6 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20">
                <h3 class="text-white text-xl font-semibold mb-4">Yardıma mı ihtiyacınız var?</h3>
                <div class="flex flex-col sm:flex-row gap-4 justify-center text-gray-300">
                    <div class="flex items-center justify-center">
                        <i class="fas fa-phone text-red-400 mr-2"></i>
                        <span>+90 212 522 00 00</span>
                    </div>
                    <div class="flex items-center justify-center">
                        <i class="fas fa-envelope text-red-400 mr-2"></i>
                        <span>info@efecanticaret.com</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
